<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>

    // METHODE & ARRAY METHODE
        let olahraga = ["Sepak Bola", "Bulu Tangkis", "Renang", "Lari"]
        // 1. Includes() -> Pengecekan ada atau tidak
        let adaRenang = olahraga.includes("Renang");
        console.log("Apakah ada olahraga Renang?", adaRenang);
        // 2. Find() -> Cari renang yang panjang hurufnya dibawah 5
        let olgaPendek = olahraga.find(olga => olga.length<5);
        console.log("Olahraga > 5 huruf: ", olgaPendek)
    
    </script>

    <h1>Methode & Array Methode - Find & Check</h1>
    <P>
        1. klik kanan layar <br>
        2. pilih inspect <br>
        3. klik menu console 
    </P>

    <div class="code" style="display: flex; flex-direction: column;">
        <img src="pict/Methode & Array Methode (3).png" style="scale: 50%;"/>
    </div>
</body>
</html>
