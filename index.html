<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pemebelajaran KIDI (Audrey)</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Akt:wght@100..900&family=Amatic+SC:wght@400;700&family=Arimo:ital,wght@0,400..700;1,400..700&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Black+Ops+One&family=Jersey+10+Charted&family=League+Gothic:wdth@75..100&family=M+PLUS+Rounded+1c:wght@100;300;400;500;700;800;900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
<nav class="navbar" id="navbar">
    <div class="title-nav">
        <h1>EduCourse Dashboard</h1>
    </div>
    <div class="user">
        <span class="material-symbols-outlined">account_circle</span>
        <h1>Audrey Janeeta</h1>
    </div>
</nav>

<div class="home">

    <div class="header">
        <h2>JavaScript Library</h2>
        <h6>10 materials</h6>
    </div>

    <div class="cards">

        <div class="group">
            
            <div class="card1">
                <div class="title">Change HTML Attribute</div>
                <div class="main">
                    <img id="no-color" src="pict/no color.jpeg"/>
                    <div class="button-v">
                        <button onclick="document.getElementById('no-color').src ='pict/color.jpeg'">Color</button>
                        <button onclick="document.getElementById('no-color').src ='pict/no color.jpeg'">No Color</button>
                    </div>
                </div>
            </div>

            <div class="card2">
                <div class="title">Change HTML Content</div>
                <div class="main">
                    <p id="demo">I will change! >:3</p>
                    <div class="button-h">
                        <button type="button" onclick='document.getElementById("demo").innerHTML="I AM changed! ヾ(≧▽≦*)o"'>Click Me</button>
                        <button type="button" onclick='document.getElementById("demo").innerHTML="I will change! >:3"'>Go Back</button>
                    </div>
                </div>
            </div>

            <div class="card3">
                <div class="title">Change HTML Style</div>
                <div class="main">
                    <p id="demo2">(●'◡'●)</p>
                    <div class="button-h">
                        <button type="button" onclick='document.getElementById("demo2").style.color="#f696b3"'>Pink</button>
                        <button type="button" onclick='document.getElementById("demo2").style.color="#dd1440"'>Red</button>
                        <button type="button" onclick='document.getElementById("demo2").style.color="#5a4864"'>Black</button>
                    </div>
                </div>
            </div>

        </div>
    
    </div>
</div>

</body>
</html>
