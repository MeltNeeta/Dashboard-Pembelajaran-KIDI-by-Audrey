<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Class</title>

<body>

    <script>
        console.log("---------Syncronus----------");
        console.log("1. Datang duluan");
        console.log("2. Segera Pesan");
        console.log("3. Struk Tercetak");
        console.log("4. Pembayaran berhasil");

        console.log("------------Asyncronus-------------");
        console.log("1. Pesan Ayam Geprek Di Kasir");
        setTimeout(()=>{
            console.log("3. [asyn] Ayam Geprek Selesai Dimasak");
        },3000);
        console.log("2. Sambil menunggu saya main hp");
    </script>
    
    <h1>Syncronus & Asyncronus</h1>
    <P>
        1. klik kanan layar <br>
        2. pilih inspect <br>
        3. klik menu console 
    </P>

</body>
