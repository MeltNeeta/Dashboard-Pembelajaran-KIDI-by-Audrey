<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>try catch finally</title>
</head>
<body>

    <script>
        function prosesPembayaran(jumlah){
            try{
                console.log("1. Proses Pembayaran")
                if (jumlah < 10000){
                    throw new Error("Minimal Pembayaran 10000!");
                }
                console.log(`2. Proses Pembayaran Sebanyak Rp${jumlah} Berhasil`);
            } catch (error) {
                console.log("3. [ERROR]", error.message);
            } finally {
                console.log("4. Matikan Animasi Loading");
            }
        }

        prosesPembayaran(5000);
        prosesPembayaran(20000);
    </script>
    
    <h1>Try Catch & Finally</h1>
    <P>
        1. klik kanan layar <br>
        2. pilih inspect <br>
        3. klik menu console 
    </P>

    <h2>Code</h2>
    <div class="code" style="display: flex; flex-direction: column;">
        <img src="pict/try catch finally.png" style="scale: 50%;"/>
    </div>

</body>
</html>
