<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
</head>
<body>

    <script>
        let statusOrder = "p";
        switch (statusOrder) {
            case "PENDING":
                console.log("Pesanan Sedang Dikemas");
                break;
            case "DIKIRIM":
                console.log("Pesanan Sedang dalam Perjalanan");
                break;
            case "SELESAI":
                console.log("Pesanan Telah Diterima");
                break;
            default:
                console.log("Pesanan Tidak Diketahui");
                break;
        }
    </script>
    
    <h1>Switch Case</h1>
    <P>
        1. klik kanan layar <br>
        2. pilih inspect <br>
        3. klik menu console 
    </P>

    <h2>Code</h2>
    <div class="code" style="display: flex; flex-direction: column;">
        <img src="pict/switch case.png" style="scale: 50%;"/>
    </div>

</body>
</html>
