<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>

    <script>
        let smartphone = {
            merk: "Iphone",
            ram: 8,

        nyalakanSenter: function(){
            console.log("Senter HP menyala");
        }
        }

        console.log("Merk HP: ", smartphone.merk);
        console.log("Ram: ", smartphone.ram);
        smartphone.nyalakanSenter();

    </script>
    
    <h1>Making Object</h1>
    <P>
        1. klik kanan layar <br>
        2. pilih inspect <br>
        3. klik menu console 
    </P>

    <h2>Code</h2>
    <div class="code" style="display: flex; flex-direction: column;">
        <img src="pict/object.png" style="scale: 50%;"/>
    </div>

</body>
</html>
